name: ML Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  ml-pipeline:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ckdci
          POSTGRES_PASSWORD: ckdci
          POSTGRES_DB: ckdci
        options: >-
          --health-cmd "pg_isready -U ckdci" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: postgresql://ckdci:ckdci@localhost:5432/ckdci
        run: |
          pytest -q

      - name: Build Docker images
        run: |
          docker build -t ckdci_api -f Dockerfile.api .
          docker build -t ckdci_dashboard -f Dockerfile.dashboard .
