apiVersion: apps/v1
kind: Deployment
metadata:
  name: ckdci-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ckdci-api
  template:
    metadata:
      labels:
        app: ckdci-api
    spec:
      containers:
        - name: api
          image: ckdci_api:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: "postgresql://ckdci:ckdci@ckdci-db:5432/ckdci"
