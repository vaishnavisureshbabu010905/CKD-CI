services:
  db:
    image: postgres:15
    container_name: ckdci_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ckdci
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ckdci"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ckdci-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ckdci_api
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@db:5432/ckdci
      - SECRET_KEY=dev-secret-key-change-in-prod
      - ENV=development
      - DEBUG=True
      - MODEL_BUNDLE_PATH=/app/results/model_bundle.pkl
    volumes:
      - ./results:/app/results:ro
    ports:
      - "8000:8000"
    networks:
      - ckdci-net

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: ckdci_dashboard
    restart: on-failure
    depends_on:
      - api
    environment:
      - API_URL=http://api:8000
    ports:
      - "8501:8501"
    networks:
      - ckdci-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ckdci_frontend
    restart: on-failure
    depends_on:
      - api
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:8000
      - NEXT_PUBLIC_WS_BASE=ws://localhost:8000
    ports:
      - "3000:3000"
    networks:
      - ckdci-net

  prometheus:
    image: prom/prometheus:latest
    container_name: ckdci_prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api
    networks:
      - ckdci-net

  grafana:
    image: grafana/grafana:latest
    container_name: ckdci_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - ckdci-net

volumes:
  pgdata:

networks:
  ckdci-net:
    driver: bridge
