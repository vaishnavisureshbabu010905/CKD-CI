version: '3.8'
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: ckdci_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: ckdci_dashboard
    ports:
      - "8501:8501"
    env_file:
      - .env
    depends_on:
      - api

  db:
    image: postgres:15
    container_name: ckdci_db
    environment:
      POSTGRES_USER: ckdci
      POSTGRES_PASSWORD: ckdci
      POSTGRES_DB: ckdci
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  prometheus:
    image: prom/prometheus:latest
    container_name: ckdci_prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:latest
    container_name: ckdci_grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  db_data:
version: '3.8'
services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ckdci
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ckdci"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ckdci-net

  api:
    build: .
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@db:5432/ckdci
      - SECRET_KEY=${SECRET_KEY}
      - ENV=${ENV}
      - DEBUG=${DEBUG}
    ports:
      - "8000:8000"
    networks:
      - ckdci-net

  dashboard:
    build: .
    restart: on-failure
    depends_on:
      - api
    command: ["streamlit", "run", "dashboard/streamlit_app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    environment:
      - API_URL=http://api:8000
    ports:
      - "8501:8501"
    networks:
      - ckdci-net

volumes:
  pgdata:

networks:
  ckdci-net:
    driver: bridge
